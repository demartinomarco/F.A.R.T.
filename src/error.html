<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Fehler</title>

		<script>
			// Mirrors app.html: an explicit cookie choice wins, otherwise follow the OS
			// preference before first paint. The fallback is a standalone document, so the
			// app's theme script never runs here — this keeps the colors consistent.
			const themeCookie = document.cookie
				.split('; ')
				.find((row) => row.startsWith('theme='))
				?.split('=')[1];
			if (
				themeCookie !== 'light' &&
				(themeCookie === 'dark' || matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.classList.add('dark');
			}
		</script>

		<style>
			:root {
				--bg: #f8fafc; /* slate-50 */
				--fg: #0f172a; /* slate-900 */
				--muted: #64748b; /* slate-500 */
			}

			html.dark {
				--bg: #020617; /* slate-950 */
				--fg: #f1f5f9; /* slate-100 */
				--muted: #94a3b8; /* slate-400 */
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				background: var(--bg);
				color: var(--fg);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					'Helvetica Neue',
					Arial,
					sans-serif;
			}

			.topbar {
				position: sticky;
				top: 0;
				z-index: 10;
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0.75rem 1rem; /* py-3 px-4 */
				background: #a8082e;
				box-shadow: 0 1px 2px 0 rgb(0 0 0 / 5%);
			}

			.topbar a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 2.25rem; /* size-9 */
				height: 2.25rem;
				border-radius: 0.375rem;
				color: #fff;
				text-decoration: none;
				transition: background-color 150ms ease;
			}

			.topbar a:hover {
				background: rgb(255 255 255 / 15%);
			}

			.topbar a:focus-visible {
				outline: 2px solid #fff;
				outline-offset: 2px;
			}

			.topbar h1 {
				margin: 0;
				font-size: 1.5rem; /* text-2xl */
				font-weight: 700;
				line-height: 1.2;
				color: #fff;
			}

			.content {
				padding: 1rem;
				max-width: 46rem;
			}

			.status {
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
		</style>
	</head>

	<body>
		<div class="topbar">
			<a href="/" aria-label="Zur Startseite">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					role="img"
					aria-hidden="true"
				>
					<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
					<path
						d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
					/>
				</svg>
			</a>
			<h1>Fehler</h1>
		</div>

		<main class="content">
			<p>
				Tja, das ist peinlich… Ich weiß nicht, was passiert ist, aber ich weiß, dass du wirklich
				Pech hattest, hier zu landen. Diese Webseite funktioniert zu 99,97% der Zeit einwandfrei,
				aber heute bist du in den 0,03 % gelandet, in denen etwas schiefgelaufen ist.
			</p>
			<p class="status">Fehlercode: %sveltekit.status%</p>
		</main>
	</body>
</html>
